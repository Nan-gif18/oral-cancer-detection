
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Chat</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top, #111827 0, #020617 45%, #000 100%);
            color: #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .page-content {
            flex: 1;
            padding-top: 120px;
            padding-bottom: 60px;
        }

        .chat-wrapper {
            max-width: 800px;
            margin: auto;
            padding: 0 16px;
        }

        .chat-card {
            background: #020617;
            padding: 1.5rem;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            height: 75vh;
            border: 1px solid #1e293b;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        .title {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 1rem;
            font-weight: 600;
            background: linear-gradient(120deg, #6366f1, #22c55e);
            -webkit-background-clip: text;
            color: transparent;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 10px;
            scrollbar-width: thin;
        }

        .message {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 70%;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .hospital {
            background: linear-gradient(120deg, #0ea5e9, #0284c7);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .user {
            background: #1e293b;
            color: #e5e7eb;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-input-box {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 14px;
            background: #020617;
            border: 1px solid #1e293b;
            color: white;
            border-radius: 12px;
            font-size: 14px;
        }

        .chat-input:focus {
            outline: none;
            border-color: #22c55e;
        }

        .btn-send {
            padding: 12px 22px;
            background: linear-gradient(120deg, #22c55e, #16a34a);
            border: none;
            color: #020617;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34,197,94,0.45);
        }

        @media (max-width: 768px) {
            .message {
                max-width: 85%;
                font-size: 13px;
            }

            .chat-card {
                height: 80vh;
            }
        }
    </style>
</head>

<body>

{% include 'hospital_header.html' %}

<div class="page-content">

    <div class="chat-wrapper">

        <h2 class="title">💬 Chat with {{ user_obj.first_name }}</h2>

        <div class="chat-card">

            <div id="chat-messages"></div>

            <form id="chat-form" class="chat-input-box">
                <input type="text" id="messageInput" class="chat-input"
                       placeholder="Type your message..." required>
                <button type="submit" class="btn-send">Send</button>
            </form>

        </div>
    </div>
</div>

<script>
const chatMessages = document.getElementById("chat-messages");
const input = document.getElementById("messageInput");

const hospitalUserId = parseInt("{{ hospital_user.id }}");
const userId = parseInt("{{ user_obj.id }}");

function addMessage(text, sender){
    const div = document.createElement("div");
    div.classList.add("message", sender === "hospital" ? "hospital" : "user");
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function loadChats(){
    const res = await fetch("{% url 'hospital_view_chat' %}", {
        method: "POST",
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            hospital_user_id: hospitalUserId,
            user_id: userId
        })
    });

    const data = await res.json();
    if(data.status === "ok"){
        chatMessages.innerHTML = "";
        data.messages.forEach(msg=>{
            addMessage(msg.message, msg.from == hospitalUserId ? "hospital" : "user");
        });
    }
}

document.getElementById("chat-form").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const text = input.value;
    input.value = "";
    addMessage(text, "hospital");

    await fetch("{% url 'hospital_send_chat' %}", {
        method: "POST",
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            hospital_user_id: hospitalUserId,
            user_id: userId,
            message: text
        })
    });
    loadChats();
});

loadChats();
setInterval(loadChats, 2000);
</script>

</body>
</html>

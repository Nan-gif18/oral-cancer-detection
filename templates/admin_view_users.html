{% include 'adminheader.html' %}

<!DOCTYPE html>
<html>
<head>
    <title>View Users | Admin</title>

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f7fb;
            color: #111827;
            margin: 0;
            padding-top: 80px;
        }

        h2 {
            text-align: center;
            color: #512da8;
            margin-bottom: 40px;
        }

        .cards-wrapper {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            width: 280px;
            padding: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(81,45,168,0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            color: #512da8;
            font-weight: 600;
            font-size: 16px;
        }

        .card-header i {
            font-size: 18px;
        }

        .card p {
            margin: 6px 0;
            font-size: 14px;
        }

        .label {
            font-weight: 600;
            color: #374151;
        }

        .no-data {
            text-align: center;
            margin-top: 40px;
            color: #555;
            width: 100%;
        }
    </style>
</head>

<body>

<h2>Registered Users</h2>

<div class="cards-wrapper">

    {% for i in a %}
    <div class="card">

        <div class="card-header">
            <i class="fa-solid fa-user"></i>
            {{ i.first_name }} {{ i.last_name }}
        </div>

        <p><span class="label"><i class="fa-solid fa-envelope"></i> Email:</span> {{ i.email }}</p>

        <p><span class="label"><i class="fa-solid fa-phone"></i> Phone:</span> {{ i.phone }}</p>

        <p><span class="label"><i class="fa-solid fa-venus-mars"></i> Gender:</span> {{ i.gender }}</p>

        <p><span class="label"><i class="fa-solid fa-location-dot"></i> Place:</span> {{ i.place }}</p>

    </div>

    {% empty %}
    <p class="no-data">No users found.</p>
    {% endfor %}

</div>

</body>
</html>

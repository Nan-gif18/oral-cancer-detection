<!DOCTYPE html>
<html>
<head>
    <title>User Registration | Oral Cancer Detection</title>

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: radial-gradient(circle at top, #111827 0%, #020617 45%, #000 100%);
            color: #e5e7eb;
        }

        .register-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 200px;
        }

        .register-card {
            width: 95%;
            max-width: 520px;
            background: #020617;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #1e293b;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            background: linear-gradient(120deg, #22c55e, #60a5fa);
            -webkit-background-clip: text;
            color: transparent;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #93c5fd;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #020617;
            border: 1px solid #1e293b;
            color: #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #22c55e;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(120deg, #22c55e, #16a34a);
            border: none;
            border-radius: 10px;
            color: #020617;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34,197,94,0.45);
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #22c55e;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .register-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="register-wrapper">
    <div class="register-card">

        <h2>User Registration</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>First Name</label>
            <input type="text" name="fname" required minlength="2">

            <label>Last Name</label>
            <input type="text" name="lname" required minlength="1">

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Phone</label>
            <input type="text" name="phone" required pattern="[0-9]{10}"
                   title="Enter 10 digit phone number">

            <label>Address</label>
            <input type="text" name="address" required minlength="5">

            <label>Gender</label>
            <input type="text" name="gender" required
                   placeholder="Male / Female / Other">

            <label>Place</label>
            <input type="text" name="place" required>

            <label>Latitude</label>
            <input type="text" name="latitude" required>

            <label>Longitude</label>
            <input type="text" name="longitude" required>

            <label>Username</label>
            <input type="text" name="username" required minlength="4">

            <label>Password</label>
            <input type="password" name="password" required minlength="6">

            <button type="submit">Register</button>
        </form>

        <div class="login-link">
            Already registered?
            <a href="{% url 'login' %}">Login</a>
        </div>

    </div>
</div>

</body>
</html>

<br><br><br><br><br><br><br>

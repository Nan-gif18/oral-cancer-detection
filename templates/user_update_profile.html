<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #0f172a, #020617);
            font-family: 'Inter', sans-serif;
            color: #e5e7eb;
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
            padding-bottom: 80px;
        }

        .edit-card {
            background: #020617;
            width: 420px;
            padding: 35px 40px;
            border-radius: 18px;
            border: 1px solid #1e293b;
            box-shadow: 0 18px 50px rgba(0,0,0,0.85);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #22c55e;
            font-size: 26px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5f5;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #020617;
            color: #e5e7eb;
            font-size: 14px;
            outline: none;
            margin-bottom: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, textarea:focus {
            border-color: #22c55e;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            background: linear-gradient(120deg, #22c55e, #16a34a);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #020617;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34,197,94,0.35);
        }
    </style>
</head>

<body>

<div class="page-wrapper">
    <div class="edit-card">

        <h2>✏️ Edit Profile</h2>

        <form method="post">
            {% csrf_token %}

            <label>First Name</label>
            <input type="text" name="fname" value="{{ a.first_name }}">

            <label>Last Name</label>
            <input type="text" name="lname" value="{{ a.last_name }}">

            <label>Email</label>
            <input type="email" name="email" value="{{ a.email }}">

            <label>Phone</label>
            <input type="text" name="phone" value="{{ a.phone }}">

            <label>Gender</label>
            <input type="text" name="gender" value="{{ a.gender }}">

            <label>Place</label>
            <input type="text" name="place" value="{{ a.place }}">

            <label>Address</label>
            <textarea name="address">{{ a.address }}</textarea>

            <button type="submit">Update Profile</button>
        </form>

    </div>
</div>

</body>
</html>

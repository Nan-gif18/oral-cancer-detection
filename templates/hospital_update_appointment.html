

{% include 'hospital_header.html' %}

<style>
    body {
        background: linear-gradient(180deg, #0f172a, #020617);
        color: #e5e7eb;
        font-family: 'Poppins', sans-serif;
        margin: 0;
    }

    .page-wrapper {
        margin-top: 120px;
        margin-bottom: 200px;
        display: flex;
        justify-content: center;
    }

    .card {
        width: 520px;
        background: #111827;
        border-radius: 18px;
        border: 1px solid #1e293b;
        padding: 30px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.75);
    }

    h2 {
        text-align: center;
        color: #22c55e;
        margin-bottom: 25px;
    }

    .msg {
        text-align: center;
        font-weight: 600;
        margin-bottom: 15px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 12px;
        font-size: 14px;
    }

    th {
        text-align: left;
        color: #93c5fd;
        font-weight: 600;
        width: 40%;
    }

    td {
        width: 60%;
    }

    input[type="text"],
    input[type="date"] {
        width: 100%;
        padding: 10px 12px;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 10px;
        color: #e5e7eb;
        outline: none;
        font-size: 14px;
    }

    input:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 2px rgba(34,197,94,0.25);
    }

    .btn {
        margin-top: 10px;
        padding: 12px 28px;
        background: linear-gradient(120deg, #22c55e, #16a34a);
        color: #020617;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(34,197,94,0.4);
    }

    @media (max-width: 600px) {
        .card {
            width: 92%;
        }
    }
</style>

<div class="page-wrapper">

    <div class="card">

        <h2>✏️ Update Appointment</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="msg" style="color:{% if message.tags == 'error' %}#ef4444{% else %}#22c55e{% endif %};">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <table>
                <tr>
                    <th>Start Time</th>
                    <td>
                        <input type="text" name="start_time"
                               value="{{ a.start_time }}" required>
                    </td>
                </tr>

                <tr>
                    <th>End Time</th>
                    <td>
                        <input type="text" name="end_time"
                               value="{{ a.end_time }}" required>
                    </td>
                </tr>

                <tr>
                    <th>Date</th>
                    <td>
                        <input type="date" name="date"
                               value="{{ a.date }}" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <button type="submit" class="btn">
                            Update Appointment
                        </button>
                    </td>
                </tr>
            </table>
        </form>

    </div>

</div>

{% include 'publicfooter.html' %}

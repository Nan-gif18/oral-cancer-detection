

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat | {{ hospital_user.hospital.name }}</title>

    <style>
        :root {
            --bg-main: #020617;
            --bg-card: #0f172a;
            --bg-msg-hospital: #1e293b;
            --bg-msg-user: linear-gradient(135deg, #3b82f6, #22c55e);
            --accent: #22c55e;
            --text-main: #e5e7eb;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #111827 0%, #020617 45%, #000 100%);
            font-family: "Inter", sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* Push content below fixed header */
        .page-wrapper {
            flex: 1;
            padding-top: 130px;
            padding-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-wrapper {
            width: 100%;
            max-width: 820px;
            height: 75vh;
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            border: 1px solid #1e293b;
        }

        .chat-title {
            text-align: center;
            padding: 18px;
            font-size: 1.35rem;
            font-weight: 600;
            border-bottom: 1px solid #1e293b;
            background: linear-gradient(120deg, #6366f1, #22c55e);
            -webkit-background-clip: text;
            color: transparent;
        }

        .messages-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
        }

        .messages-box::-webkit-scrollbar {
            width: 6px;
        }

        .messages-box::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .msg {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg.user {
            background: var(--bg-msg-user);
            color: #020617;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 30px rgba(34,197,94,0.25);
        }

        .msg.hospital {
            background: var(--bg-msg-hospital);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: var(--text-main);
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
            padding: 16px;
            border-top: 1px solid #1e293b;
            background: #020617;
            border-radius: 0 0 20px 20px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 14px;
            background: #020617;
            color: white;
            border: 1px solid #334155;
            font-size: 14px;
            outline: none;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-btn {
            padding: 12px 22px;
            background: linear-gradient(120deg, #6366f1, #22c55e);
            border: none;
            color: #020617;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(99,102,241,0.4);
        }

        @media (max-width: 768px) {
            .chat-wrapper {
                height: 80vh;
                margin: 0 10px;
            }

            .msg {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

{% include 'user_header.html' %}

<div class="page-wrapper">

    <div class="chat-wrapper">

        <div class="chat-title">
            💬 Chat with {{ hospital_user.hospital.name }}
        </div>

        <div id="messages" class="messages-box"></div>

        <form id="chatForm" class="chat-input-area">
            <input type="text" id="msgInput" class="chat-input" placeholder="Type your message..." required>
            <button type="submit" class="chat-btn">Send</button>
        </form>

    </div>

</div>

<script>
const box = document.getElementById("messages");
const input = document.getElementById("msgInput");

const userId = parseInt("{{ user_obj.id }}");
const hospitalUserId = parseInt("{{ hospital_user.id }}");

function addMsg(text, sender){
    const div = document.createElement("div");
    div.classList.add("msg", sender === "user" ? "user" : "hospital");
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

async function loadChats(){
    const res = await fetch("{% url 'user_view_chat' %}", {
        method: "POST",
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            user_id: userId,
            hospital_user_id: hospitalUserId
        })
    });

    const data = await res.json();
    if(data.status === "ok"){
        box.innerHTML = "";
        data.messages.forEach(msg=>{
            addMsg(msg.message, msg.from == userId ? "user" : "hospital");
        });
    }
}

document.getElementById("chatForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const text = input.value;
    input.value = "";
    addMsg(text, "user");

    await fetch("{% url 'user_send_chat' %}", {
        method: "POST",
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
            user_id: userId,
            hospital_user_id: hospitalUserId,
            message: text
        })
    });
    loadChats();

});

loadChats();
setInterval(loadChats, 2000);
</script>


{% include 'publicfooter.html' %}


</body>
</html>

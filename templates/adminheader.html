<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oral Cancer Detection | Admin Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Header */
        .admin-header {
            height: 60px;
            background: linear-gradient(90deg, #7b1fa2, #512da8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 250px;
            height: calc(100vh - 60px);
            background-color: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: #333;
            text-decoration: none;
            font-weight: 500;
        }

        .sidebar a i {
            margin-right: 10px;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #ede7f6;
            color: #512da8;
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            padding: 90px 30px 30px;
        }

        /* Dashboard Cards */
        .dashboard-card {
            border-radius: 15px;
            padding: 25px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card-purple { background: linear-gradient(135deg, #8e24aa, #5e35b1); }
        .card-blue { background: linear-gradient(135deg, #1e88e5, #3949ab); }
        .card-green { background: linear-gradient(135deg, #43a047, #2e7d32); }
        .card-red { background: linear-gradient(135deg, #e53935, #c62828); }

        .dashboard-card h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .dashboard-card span {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

<!-- ================= HEADER ================= -->
<div class="admin-header">
    <h5 class="mb-0">🦷 Oral Cancer Detection – Admin</h5>
    <a href="/logout_user" class="btn btn-light btn-sm">
        <i class="bi bi-box-arrow-right"></i> Logout
    </a>
</div>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
    <a href="/adminhome/" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/admin_manage_hospital/"><i class="bi bi-hospital"></i> Manage hospital</a>
{#    <a href="/admin_view_approved_hospitals/"><i class="bi bi-check-circle"></i> Approved Hospitals</a>#}
    <a href="/admin_view_users/"><i class="bi bi-people"></i> Users</a>
    <a href="/admin_view_complaints/"><i class="bi bi-chat-dots"></i> Complaints</a>
    <a href="/admin_manage_educational_material/"><i class="bi bi-journal-text"></i> Educational Materials</a>
    <a href="/admin_view_camps/"><i class="bi bi-geo-alt"></i> Screening Camps</a>

</div>
